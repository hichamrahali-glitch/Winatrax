<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxembourg's top 5 trading partners</title>
<!--
  Animated map of Luxembourg's five largest trading partners over time (D3 + world-atlas).
  Data is injected at the DATA placeholder below by top5_map.py, either into the World map
  tab of monica_app.py or into the standalone file output/top5_map.html.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --sea: #f3f6f9;
  --land: #e4e2dc;
  --land-edge: #ffffff;
  --land-hover: #d3d0c8;
  --fg: #0e1117;
  --fg-2: #4a4f59;
  --muted: #808590;
  --line: #e3e5e8;
  --lux: #0e1117;
  --r1: #0d366b; --r2: #1c5cab; --r3: #2a78d6; --r4: #5598e7; --r5: #86b6ef;
  --up: #1a7f37; --down: #b42318;
  --sel: #6250d6; --exp: #2a78d6; --imp: #eb6834;
  --font: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, sans-serif;
}
:root[data-flow="Imports"] { --r1: #7a2b0c; --r2: #b8461a; --r3: #eb6834; --r4: #f08a5d; --r5: #f5ad8f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --surface: #161a22; --sea: #11151c; --land: #2a2f39; --land-edge: #11151c; --land-hover: #3a404c;
    --fg: #f0f2f6; --fg-2: #b9bec8; --muted: #8a909c; --line: #2b313b; --lux: #f0f2f6; --up: #4ac26b; --down: #f47067; --sel: #9085e9; --exp: #3987e5; --imp: #d95926;
    --r1: #9ec5f4; --r2: #6da7ec; --r3: #3987e5; --r4: #256abf; --r5: #184f95; color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-flow="Imports"] { --r1: #f8c6ae; --r2: #f4a685; --r3: #eb6834; --r4: #c4501f; --r5: #8f3510; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); }
.app { display: grid; gap: 12px; padding: 4px 2px 8px; }

/* header */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-size: clamp(20px, 2.6vw, 26px); line-height: 1.15; font-weight: 700; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 600 13px var(--font); border: 0; background: none; color: var(--fg-2); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--r3); color: #fff; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--r3); outline-offset: 2px; }

/* map + panel */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
.mapwrap { position: relative; background: var(--sea); border-radius: 14px; overflow: hidden; height: 540px; }
#map { display: block; width: 100%; height: 100%; cursor: grab; }
#map:active { cursor: grabbing; }
.country { fill: var(--land); stroke: var(--land-edge); stroke-width: .6px; vector-effect: non-scaling-stroke; transition: fill .45s ease; }
.country:hover { fill: var(--land-hover); }
.country.r1 { fill: var(--r1); } .country.r2 { fill: var(--r2); } .country.r3 { fill: var(--r3); } .country.r4 { fill: var(--r4); } .country.r5 { fill: var(--r5); }
.country.lux { fill: var(--lux); }
.country { cursor: pointer; }
.detail-mode .country.r1, .detail-mode .country.r2, .detail-mode .country.r3, .detail-mode .country.r4, .detail-mode .country.r5 { fill-opacity: .3; }
.country.sel, .detail-mode .country.sel { fill: var(--sel); fill-opacity: 1; stroke: var(--fg); stroke-width: 1.4px; }
.flow-base { fill: none; stroke-linecap: round; opacity: .22; }
.flow-dash { fill: none; stroke-linecap: round; stroke-dasharray: 1 11; animation: flow 1.1s linear infinite; }
.flow-dash.in { animation-direction: reverse; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.label rect { fill: var(--surface); stroke: var(--line); }
.label .nm { font-weight: 700; font-size: 13px; fill: var(--fg); }
.label .val { font-size: 12px; fill: var(--fg-2); font-variant-numeric: tabular-nums; }
.label .badge-t { font-weight: 700; font-size: 12px; fill: #fff; }
.leader { stroke: var(--fg-2); stroke-width: 1; opacity: .55; }
.anchor { stroke: var(--surface); stroke-width: 1.5; }
.luxdot { fill: var(--lux); stroke: var(--surface); stroke-width: 2; }
.luxring { fill: none; stroke: var(--lux); stroke-width: 1.5; opacity: .5; animation: pulse 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(.6); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
.luxlbl { font-size: 12px; font-weight: 700; fill: var(--fg); paint-order: stroke; stroke: var(--sea); stroke-width: 3px; }
.period { position: absolute; left: 16px; bottom: 12px; font-size: clamp(28px, 4.4vw, 46px); font-weight: 700; color: var(--fg); opacity: .16; pointer-events: none; font-variant-numeric: tabular-nums; }
.fit { position: absolute; right: 12px; top: 12px; font: 600 12.5px var(--font); color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; box-shadow: 0 2px 8px rgb(0 0 0 / .08); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; box-shadow: 0 6px 18px rgb(0 0 0 / .14); white-space: nowrap; z-index: 3; }
.tip b { font-variant-numeric: tabular-nums; }
.tip .m { color: var(--muted); font-size: 12px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }

.panel { display: grid; gap: 12px; align-content: start; }
.kpi { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.kpi .k { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.kpi .v { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .n { font-size: 13px; color: var(--fg-2); }
.list { position: relative; height: calc(5 * 66px); }
.row { position: absolute; left: 0; right: 0; height: 58px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 10px; align-items: center;
  padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .3s; }
.row .badge { grid-row: 1 / 3; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; transition: background .45s; }
.row .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .val { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.row .bar { grid-column: 2; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.row .bar i { display: block; height: 100%; border-radius: 3px; transition: width .45s, background .45s; }
.row .chg { grid-column: 3; font-size: 12px; text-align: right; color: var(--muted); white-space: nowrap; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }

/* country detail */
.main.wide { grid-template-columns: minmax(0, 1fr) 360px; }
.detail { display: grid; gap: 12px; align-content: start; max-height: 540px; overflow-y: auto; padding-right: 4px; }
.back { justify-self: start; font: 600 13px var(--font); color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.detail h2 { margin: 0; font-size: 24px; line-height: 1.1; }
.detail .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.dk { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dk > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); }
.dk .k { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.dk .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dk .n { font-size: 12px; color: var(--fg-2); }
.dk .wide { grid-column: 1 / -1; }
.goods h3 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 7px; }
.goods h3 i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.goods ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.goods li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 2px; align-items: center; font-size: 13px; }
.goods .rk { color: var(--muted); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.goods .gn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goods .gn small { color: var(--muted); margin-right: 5px; font-variant-numeric: tabular-nums; }
.goods .gv { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.goods .gb { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.goods .gb i { display: block; height: 100%; border-radius: 3px; }
.goods li.click { cursor: pointer; border-radius: 6px; margin: 0 -6px; padding: 3px 6px; }
.goods li.click:hover, .goods li.click:focus-visible { background: var(--sea); }
.goods li.click .gn::after { content: " ›"; color: var(--muted); }
.goods li.prod { padding: 3px 0; }
.goods li.prod .gn { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
.goods .leaf { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail .note { margin: 0; }
.detail h2.long { font-size: 17px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 12.5px; color: var(--muted); }
.crumb { font: 600 12.5px var(--font); color: var(--r3); background: none; border: 0; padding: 1px 2px; cursor: pointer; border-radius: 4px; }
.crumb:hover { text-decoration: underline; }
.crumb.now { color: var(--fg); font-weight: 700; cursor: default; }
.crumbs .sep { color: var(--muted); }
.goods .other { color: var(--muted); font-size: 12px; margin-top: 4px; }
.empty { color: var(--muted); font-size: 13px; }
.row { cursor: pointer; }
.row:hover { border-color: var(--fg-2); }
.flow-base.exp, .flow-dash.exp { stroke: var(--exp); } .flow-base.imp, .flow-dash.imp { stroke: var(--imp); }

/* timeline */
.timeline { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px 14px; align-items: center; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--r3); color: #fff; cursor: pointer; display: grid; place-items: center; }
.play svg { width: 18px; height: 18px; fill: currentColor; }
.ctl { display: flex; gap: 8px; align-items: center; }
select { font: 600 13px var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.track { position: relative; display: grid; gap: 0; min-width: 0; }
.track svg { display: block; width: 100%; height: 34px; cursor: pointer; }
.track input { width: 100%; margin: 0; accent-color: var(--r3); }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }

@media (max-width: 820px) {
  .main, .main.wide { grid-template-columns: 1fr; }
  .mapwrap { height: 400px; }
  .detail { max-height: none; overflow: visible; }
  .timeline { grid-template-columns: auto minmax(0, 1fr); }
  .ctl { grid-column: 1 / -1; order: 3; }
}
@media (prefers-reduced-motion: reduce) {
  .flow-dash, .luxring { animation: none; }
  .row, .country { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow">Luxembourg · all goods</div>
      <h1 id="title">Who buys the most from Luxembourg?</h1>
    </div>
    <div class="toggles">
      <span class="seg" id="g-flow"><button data-v="Imports" aria-pressed="false">Imports</button><button data-v="Exports" aria-pressed="true">Exports</button></span>
      <span class="seg" id="g-measure"><button data-v="value" aria-pressed="true">Value €</button><button data-v="quantity" aria-pressed="false">Weight t</button></span>
    </div>
  </header>

  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="Map of Luxembourg's five largest trading partners"></svg>
      <div class="period" id="period"></div>
      <button class="fit" id="fit" hidden>Re-centre</button>
      <div class="tip" id="tip" hidden></div>
      <div class="loading" id="loading">Loading map…</div>
    </div>
    <aside class="panel" aria-label="Top 5 partners or selected country">
      <div class="detail" id="detail" hidden></div>
      <div class="kpi" id="topkpi"><div class="k" id="kpi-k">Top 5 share of exports</div><div class="v" id="kpi-v">–</div><div class="n" id="kpi-n">&nbsp;</div></div>
      <div class="list" id="list"></div>
    </aside>
  </div>

  <div class="timeline">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="ico"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <div class="ctl">
      <select id="step" aria-label="Step"><option selected>Yearly</option><option>Monthly</option></select>
      <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    </div>
    <div class="track">
      <svg id="spark" aria-hidden="true"></svg>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Timeline">
      <div class="ends"><span id="t0"></span><span id="t1"></span></div>
    </div>
  </div>
  <p class="note" id="note"></p>
</div>

<script>
const DATA = /*__DATA__*/null;
const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json";
const LUX = [6.13, 49.61];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = id => document.getElementById(id);

if (!DATA) {
  $("loading").textContent = "No data: open output/top5_map.html (built by top5_map.py) or the World map tab of the app.";
  throw new Error("no data");
}

const S = { flow: DATA.init.flow, measure: DATA.init.measure, step: "Yearly", speed: 1, pos: 0, playing: false, auto: true, focusKey: "", sel: null, chap: null };
const FR = DATA.frames;
const ser = () => DATA.series[`${S.measure}|${S.flow}`];
const name = c => DATA.names[c] || c;
const rankVar = r => `var(--r${r})`;
function fmt(v) {   // value in million EUR, quantity in thousand tonnes
  if (v == null) return "–";
  if (S.measure === "value") return v >= 1000 ? `€${(v / 1000).toFixed(1)} bn` : v >= 100 ? `€${v.toFixed(0)} m` : v >= 1 ? `€${v.toFixed(1)} m` : `€${(v * 1000).toFixed(0)} k`;
  return v >= 1000 ? `${(v / 1000).toFixed(1)} Mt` : v >= 10 ? `${v.toFixed(0)} kt` : v >= 0.01 ? `${v.toFixed(2)} kt` : `${(v * 1000).toFixed(0)} t`;
}
const PP = DATA.pp || {}, HS2 = DATA.hs2 || {}, TREE = DATA.trees || {}, LABELS = DATA.labels || {};
const CODE_OF = new Map(Object.entries(DATA.ids).map(([c, id]) => [id, c]));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const periodLabel = f => `12 months to ${MON[+f.slice(5) - 1]} ${f.slice(0, 4)}`;

/* ---------- frames for the chosen step ---------- */
let IDX = [];
function buildIdx() {
  const n = FR.length;
  IDX = FR.map((f, i) => i).filter(i => S.step === "Monthly" || FR[i].slice(5) === "12");
  if (IDX[IDX.length - 1] !== n - 1) IDX.push(n - 1);
  $("scrub").max = IDX.length - 1;
  $("t0").textContent = FR[IDX[0]].slice(0, 4); $("t1").textContent = periodLabel(FR[n - 1]).replace("12 months to ", "");
}
const frame = () => IDX[S.pos];

/* ---------- map ---------- */
const svg = d3.select("#map"), gZoom = svg.append("g"), gLand = gZoom.append("g"), gOver = svg.append("g"), gFlows = gOver.append("g"), gDet = gOver.append("g"), gLux = gOver.append("g"), gLabels = gOver.append("g");
let W = 800, H = 500, projection, path, features = [], byId = new Map(), mainPart = new Map(), view = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([1, 60])
  .on("start", ev => { if (ev.sourceEvent) { S.auto = false; $("fit").hidden = false; } })
  .on("zoom", ev => { view = ev.transform; gZoom.attr("transform", view); drawOverlay(); });
svg.call(zoom).on("dblclick.zoom", null);

function largestPolygon(f) {
  if (!f.geometry || f.geometry.type !== "MultiPolygon") return f;
  let best = null, area = -1;
  f.geometry.coordinates.forEach(c => { const g = { type: "Feature", geometry: { type: "Polygon", coordinates: c } }, a = d3.geoArea(g); if (a > area) { area = a; best = g; } });
  return best;
}
function resize() {
  const r = $("mapwrap").getBoundingClientRect(); W = Math.max(320, r.width); H = Math.max(360, r.height);
  svg.attr("viewBox", `0 0 ${W} ${H}`);
  projection = d3.geoNaturalEarth1().fitExtent([[10, 10], [W - 10, H - 10]], { type: "Sphere" });
  path = d3.geoPath(projection);
  gLand.selectAll("path").attr("d", path);
  zoom.extent([[0, 0], [W, H]]).translateExtent([[-W, -H], [2 * W, 2 * H]]);
}

/* ---------- current top 5 ---------- */
function current() {
  const s = ser(), i = frame(), rows = (s.frames[i] || []).filter(r => r[1] > 0), world = s.world[i];
  return { top: rows.slice(0, 5).map(([c, v, prev], k) => ({ c, v, prev, r: k + 1, id: DATA.ids[c] })), all: rows, world, i };
}
function anchorOf(d) {   // projected point inside the country's main landmass
  const f = byId.get(d.id); if (!f) return null;
  return path.centroid(mainPart.get(d.id));
}

function focus(cur, animate) {
  const pts = [projection(LUX)];
  cur.top.forEach(d => { const f = byId.get(d.id); if (f) { const b = path.bounds(mainPart.get(d.id)); pts.push(b[0], b[1]); } });
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const padX = 120, padY = 70;   // room for labels around the edge
  const k = Math.max(1, Math.min(60, Math.min((W - 2 * padX) / Math.max(1, x1 - x0), (H - 2 * padY) / Math.max(1, y1 - y0))));
  const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  const dur = animate ? Math.min(1100, 900 / S.speed + 200) : 0;
  svg.transition().duration(dur).ease(d3.easeCubicInOut).call(zoom.transform, t);
}

function focusCountry(code, animate) {
  const id = DATA.ids[code], f = id && mainPart.get(id); if (!f) return;
  const [[x0, y0], [x1, y1]] = path.bounds(f), pad = 90;
  const k = Math.max(1, Math.min(40, Math.min((W - 2 * pad) / Math.max(1, x1 - x0), (H - 2 * pad) / Math.max(1, y1 - y0))));
  const t = d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  svg.transition().duration(animate ? 900 : 0).ease(d3.easeCubicInOut).call(zoom.transform, t);
}

function drawLand(cur) {
  const rank = new Map(cur.top.filter(d => d.id).map(d => [d.id, d.r]));
  const selId = S.sel && DATA.ids[S.sel];
  gLand.selectAll("path").attr("class", f => "country" + (f.id === selId ? " sel" : rank.has(f.id) ? " r" + rank.get(f.id) : f.id === "442" ? " lux" : ""));
  svg.classed("detail-mode", !!S.sel);
}

let CUR = null;
const curve = (p, q) => { const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1, bend = Math.min(80, len * .22);
  return `M${p[0]},${p[1]} Q${mx - dy / len * bend},${my + dx / len * bend} ${q[0]},${q[1]}`; };
function drawLux(lux) {

  const code = CODE_OF.get(f.id);
  const rows = CUR.all, k = code ? rows.findIndex(r => r[0] === code) : -1;
  tip.innerHTML = k >= 0 ? `<b>#${k + 1} ${name(code)}</b><br>${fmt(rows[k][1])}${CUR.world ? ` · ${(rows[k][1] / CUR.world * 100).toFixed(1)}%` : ""}<br><span class="m">Click for details</span>` : `<b>${code ? name(code) : f.properties.name}</b><br><span class="m">${f.id === "442" ? "Reporter" : code ? "Outside the top 10 · click for details" : "No trade recorded"}</span>`;
  tip.hidden = false;
  const r = $("mapwrap").getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  tip.style.left = Math.min(r.width - tip.offsetWidth - 8, x + 14) + "px"; tip.style.top = Math.max(8, y - 40) + "px";
}).on("pointerleave", () => tip.hidden = true)
  .on("click", ev => { const f = ev.target.__data__; if (!f) return; select(CODE_OF.get(f.id) || null); });

/* ---------- boot ---------- */
$("eyebrow").textContent = `Luxembourg · ${DATA.product}`;
buildIdx(); S.pos = IDX.length - 1;
d3.json(WORLD_URL).then(world => {
  features = topojson.feature(world, world.objects.countries).features.filter(f => f.id !== "010");   // drop Antarctica
  features.forEach(f => { byId.set(f.id, f); mainPart.set(f.id, largestPolygon(f)); });
  gLand.selectAll("path").data(features).join("path").attr("class", "country");
  $("loading").remove();
  resize(); drawSpark(); update(false);
  new ResizeObserver(() => { resize(); drawSpark(); S.focusKey = ""; update(false); }).observe($("mapwrap"));
}).catch(() => { $("loading").textContent = "Could not load the world map (needs an internet connection to cdn.jsdelivr.net)."; });
</script>
</body>
</html>
